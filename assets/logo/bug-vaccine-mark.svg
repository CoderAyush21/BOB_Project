<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bug Vaccine">
  <!-- Shield = protection. Inside: an assay plate. Eight past bugs caught (green), one slipping through (red beetle). -->
  <path d="M32 3.5 55 11v19.5C55 45 45.5 55 32 60.5 18.5 55 9 45 9 30.5V11Z" fill="#2456A6"/>
  <path d="M32 7.8 51.2 14v16.6c0 12.4-8 21-19.2 25.7C20.8 51.6 12.8 43 12.8 30.6V14Z" fill="#F4F8FF"/>
  <g fill="#1D7A4E">
    <circle cx="22" cy="21.5" r="3.7"/><circle cx="32" cy="21.5" r="3.7"/><circle cx="42" cy="21.5" r="3.7"/>
    <circle cx="22" cy="31.5" r="3.7"/><circle cx="42" cy="31.5" r="3.7"/>
    <circle cx="22" cy="41.5" r="3.7"/><circle cx="32" cy="41.5" r="3.7"/><circle cx="42" cy="41.5" r="3.7"/>
  </g>
  <!-- the one that got through: a beetle, seen from above -->
  <g transform="translate(32 31.8)">
    <path d="M-1.3-3.9-2.8-5.6M1.3-3.9 2.8-5.6" stroke="#B42A1F" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="0.4" rx="3.3" ry="4.1" fill="#B42A1F"/>
    <path d="M0-3.1V4.4" stroke="#F4F8FF" stroke-width="0.9"/>
  </g>
</svg>
