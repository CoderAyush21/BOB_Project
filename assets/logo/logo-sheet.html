<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bug Vaccine logo sheet</title>
<style>
body{margin:0;font:14px system-ui,sans-serif;color:#15201E;background:#EEF2F1}
.row{display:flex;gap:28px;align-items:flex-end;padding:28px 36px;flex-wrap:wrap}
.dark{background:#0E1413;color:#E3ECEA}
figure{margin:0;display:grid;gap:8px;justify-items:center}
figcaption{font-size:12px;opacity:.7}
</style></head><body>
<div class="row">
  <figure><img src="bug-vaccine-logo.svg" width="330"><figcaption>logo (light)</figcaption></figure>
  <figure><img src="bug-vaccine-mark.svg" width="128"><figcaption>mark 128</figcaption></figure>
  <figure><img src="bug-vaccine-mark.svg" width="64"><figcaption>64</figcaption></figure>
  <figure><img src="bug-vaccine-mark.svg" width="40"><figcaption>40</figcaption></figure>
  <figure><img src="bug-vaccine-icon.svg" width="32"><figcaption>icon 32</figcaption></figure>
  <figure><img src="bug-vaccine-icon.svg" width="16"><figcaption>icon 16</figcaption></figure>
</div>
<div class="row dark">
  <figure><img src="bug-vaccine-logo-dark.svg" width="330"><figcaption>logo (dark)</figcaption></figure>
  <figure><img src="bug-vaccine-icon.svg" width="32"><figcaption>icon 32</figcaption></figure>
  <figure><img src="bug-vaccine-icon.svg" width="16"><figcaption>icon 16</figcaption></figure>
</div>
</body></html>
